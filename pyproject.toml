[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mincore"
version = "0.3.4"
description = "Shared collection core for CMW and KCMO weekly digests: URL resolution, body extraction, cards, ledger, run reports"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "trafilatura>=2.0",
    "googlenewsdecoder==0.2.1",
    # googlenewsdecoder 0.2.1은 selectolax 1.0의 Modest 백엔드 제거로 import 실패
    "selectolax<1.0",
    "feedparser>=6.0.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]
# 요약 단계 (mincore.summarize·regen) — 수집만 쓰는 곳은 설치 불필요
summarize = ["anthropic>=0.40"]

[tool.setuptools.packages.find]
include = ["mincore*"]

[tool.setuptools.package-data]
mincore = ["domain_rules.yaml", "schema/*.json"]
